; ==============================================================================
; HP Overlay 怪物血条显示模组 配置文件
; ==============================================================================
; 说明：
; 1. 本模组支持热加载或随游戏启动加载，位于 plugins 同级目录下。
; 2. 颜色值均为 RGBA 格式，范围为 0 ~ 255。
;    - R: 红色通道 (Red)
;    - G: 绿色通道 (Green)
;    - B: 蓝色通道 (Blue)
;    - A: 不透明度 (Alpha, 0 为完全透明，255 为完全不透明)
; 3. 坐标与尺寸单位为像素 (px)。
; ==============================================================================

[Position]
; 血条左上角起始 X 轴坐标 (横向位置，从屏幕左侧起算)
pos_x = 0.0

; 第一条血条左上角起始 Y 轴坐标 (纵向位置，从屏幕顶部起算)
pos_y = 736.0

; 血条总宽度 (像素)
bar_width = 320.0

; 血条总高度 (像素)
bar_height = 45.0

; 多只怪物时，各怪物血条之间的垂直间距/行高 (当前血条顶部到下一血条顶部的距离)
row_spacing = 52.0


[Font]
; 文字大小 (点数/像素大小，默认建议 14.0)
font_size = 14.0

; 是否开启文字描边轮廓 (true: 开启描边，提高复杂画面中的文字可读性; false: 关闭描边)
font_outline = true

; 文字在血条内的垂直对齐微调偏移量 (单位: 像素)
; - 默认值 -3.0，刚好抵消英文字符基线与行距导致的下沉，使文字处于血条正中央
; - 负数向上偏移，正数向下偏移
text_offset_y = -3.0

; 文字主颜色 (默认纯白 255, 255, 255, 255)
; 注意：当怪物不在当前地图/异区时，插件会自动降低该颜色的亮度和透明度以示区分
font_color_r = 255
font_color_g = 255
font_color_b = 255
font_color_a = 255

; 文字描边轮廓颜色 (默认带半透明黑色 0, 0, 0, 220)
outline_color_r = 0
outline_color_g = 0
outline_color_b = 0
outline_color_a = 220


[BarColor]
; 剩余血量进度条颜色 (绿色层，显示怪物当前剩余生命值)
green_r = 45
green_g = 205
green_b = 75
green_a = 120

; 已损失血量进度条背景颜色 (红色层，血量减少时露出的底层红色)
red_r = 210
red_g = 45
red_b = 45
red_a = 120

; 血条整体底框背景色 (在血条最底层，用于填充和衬底)
bg_r = 20
bg_g = 20
bg_b = 20
bg_a = 0

; 血条外边框线条颜色
border_r = 230
border_g = 230
border_b = 230
border_a = 0

; 仿原生 UI 血条: 猎人图腾与点阵边框颜色及透明度 (RGBA 0~255)
; - totem_a 为点亮状态点的透明度 (默认 200；255 为不透明；0 为完全透明)
totem_r = 70
totem_g = 130
totem_b = 230
totem_a = 200


[Display]
; 是否开启仿原生UI样式 (推荐: true)
; - true:  开启 MHGU 仿原生 UI 风格
; - false: 使用经典极简扁平血条风格
native_style = true

; 是否开启血条水平左右镜像反转 (推荐: true)
; - true:  开启镜像反转 (猎人图腾置于右侧，满血靠右，从左向右扣血；文字保持正常阅读；适合血条放置在屏幕左侧)
; - false: 常规布局 (猎人图腾置于左侧，满血靠左，从右向左扣血；适合血条放置在屏幕右侧)
mirror = true

; 是否仅显示同区怪物的血条
; - false: 始终显示任务中所有大型怪物的血条 (异区怪物的文字颜色会自动变暗区分)
; - true:  仅当怪物与玩家处于同一个地图区域时才显示
current_map_only = false

; 是否显示调试信息 (HUD 左上角显示分辨率、内存堆地址、指针、怪物数量等诊断信息)
; - true:  开启调试 HUD (用于排查指针或扫描问题)
; - false: 关闭调试 HUD (正常游戏体验建议设为 false)
show_debug = true
